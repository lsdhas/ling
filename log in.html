<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录/注册</title>
    <link rel="stylesheet" href="css/log in.css">
</head>

<body>
    <div class="login">
        <h2>登录/注册</h2>
        <form action="">
            <label for="username">用户名/邮箱</label>
            <input type="text" id="username" name="username" required value="请输入用户名/邮箱："><br><br>

            <label for="password">密码</label>
            <input type="password" id="password" name="password" required value="请输入密码"><br><br>

            <input type="submit" value="登录">
            <p>还没有账号？<a href="#">去注册</a></p>
        </form>
    </div>
</body>

</html>
